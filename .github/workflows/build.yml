# สร้าง image แล้วเก็บที่ ghcr.io/gotroger/roger-comfy (แท็ก latest + วันที่-ครั้งที่) ทุกครั้งที่ push ขึ้น main
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # torch cu130 + CUDA ใหญ่ ~10 GB — ลบเครื่องมือที่ไม่ใช้บน runner ให้ดิสก์พอ
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        id: tag
        run: echo "version=$(date -u +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/gotroger/roger-comfy:latest
            ghcr.io/gotroger/roger-comfy:${{ steps.tag.outputs.version }}
